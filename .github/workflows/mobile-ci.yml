name: Mobile CI

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-typecheck:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: [mobile-typecheck]
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (Vitest)
        run: npx vitest run --no-coverage

      - name: Run component tests (Jest)
        run: npx jest --no-coverage

  mobile-build:
    name: Android Bundle Verification
    runs-on: ubuntu-latest
    needs: [mobile-typecheck, mobile-tests]
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Expo dependency and native configuration health
        run: npx expo-doctor

      - name: Resolve Google Play production config
        env:
          EXPO_PUBLIC_DISTRIBUTION_CHANNEL: google-play
          EXPO_PUBLIC_ENABLE_WEB3_FEATURES: "false"
          EXPO_PUBLIC_ENABLE_GOOGLE_SIGN_IN: "false"
          API_BASE_URL: https://estories.app
        run: npx expo config --type public

      - name: Export Android production bundle
        env:
          EXPO_PUBLIC_DISTRIBUTION_CHANNEL: google-play
          EXPO_PUBLIC_ENABLE_WEB3_FEATURES: "false"
          EXPO_PUBLIC_ENABLE_GOOGLE_SIGN_IN: "false"
          API_BASE_URL: https://estories.app
        run: npx expo export --platform android --output-dir dist-android
