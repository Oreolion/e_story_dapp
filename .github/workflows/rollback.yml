name: Prepare Production Rollback

on:
  workflow_dispatch:
    inputs:
      commit_to_revert:
        description: "Exact 40-character commit SHA to revert (single-parent commit)"
        required: true
        type: string
      reason:
        description: "Incident and reason for preparing a rollback candidate"
        required: true
        type: string

# Preparation only: cannot push, publish, promote or create issues.
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare reviewable rollback patch
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact revert without changing production
        env:
          REVERT_SHA: ${{ inputs.commit_to_revert }}
          BASE_SHA: ${{ github.sha }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [[ ! "$REVERT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo '::error::An exact commit SHA is required'; exit 1
          fi
          git cat-file -e "${REVERT_SHA}^{commit}"
          git merge-base --is-ancestor "$REVERT_SHA" "$BASE_SHA"
          if [ "$(git rev-list --parents -n 1 "$REVERT_SHA" | wc -w)" -ne 2 ]; then
            echo '::error::Merge/root commits require a separately reviewed rollback plan'; exit 1
          fi
          git revert --no-commit "$REVERT_SHA"
          mkdir -p rollback-candidate
          git diff --cached --binary > rollback-candidate/revert.patch
          if [ ! -s rollback-candidate/revert.patch ]; then
            echo '::error::Revert produced no candidate changes'; exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('rollback-candidate/review.json', JSON.stringify({
            baseSha: process.env.BASE_SHA,
            revertedSha: process.env.REVERT_SHA.toLowerCase(),
            reason: process.env.ROLLBACK_REASON,
            status: 'UNTESTED_CANDIDATE_ONLY',
            required: [
              'Review retained database schema, in-flight jobs and payment receipt compatibility',
              'Apply patch on a short-lived feature branch and run all release checks',
              'Run the production audit for the exact commit, artifact and environment',
              'Merge through protected master only after the release gate clears',
              'Verify the delivered artifact and affected user journeys'
            ]
          }, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: rollback-candidate-${{ github.sha }}
          path: rollback-candidate/
          if-no-files-found: error
          retention-days: 14
