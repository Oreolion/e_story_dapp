name: Verify exact staging candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit deployed to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-verification
  cancel-in-progress: false

jobs:
  verify:
    # Workflow code must come from the protected default branch. Candidate code
    # is never checked out or executed with environment credentials.
    if: github.ref == 'refs/heads/master'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # This is the trusted workflow commit on master, never candidate_sha.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source, environment and indexing isolation
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
          # Dedicated staging project only. Never use the production bypass.
          STAGING_PROTECTION_BYPASS: ${{ secrets.STAGING_PROTECTION_BYPASS }}
        run: node scripts/verify-staging.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-binding-${{ github.run_id }}
          path: staging-binding.json
          if-no-files-found: error
